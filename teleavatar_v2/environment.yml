# Human-maintained deployment specification.
#
# Keep only direct dependencies here. Do not replace this file with the output
# of `conda env export`, which records machine-specific build hashes and every
# transitive CUDA package.
name: teleavatar-smolvla

channels:
  - robostack-staging
  - conda-forge
  - nodefaults

dependencies:
  # Runtime and ROS2 interfaces.
  - python=3.11
  - pip>=24,<26
  - ros-humble-ros-base=0.10.*
  - ros-humble-rclpy=3.3.*
  - ros-humble-sensor-msgs=4.9.*
  - ros-humble-std-msgs=4.9.*

  # RTP/H.265 decode and Python GObject bindings. gst-python is intentionally
  # omitted: PyGObject supplies gi.repository.Gst, while the gst-python plugin
  # is not needed and has caused libgstpython.so scanner crashes.
  - gstreamer>=1.24,<1.25
  - gst-libav>=1.24,<1.25
  - gst-plugins-base>=1.24,<1.25
  - gst-plugins-bad>=1.24,<1.25
  - gst-plugins-good
  - pygobject>=3.48,<4
  - opencv>=4.10,<5

  # Keep NumPy on the ABI used by the RoboStack Humble packages. fsspec is
  # pinned below because datasets 3.6 rejects releases newer than 2025.3.0.
  - numpy=1.26.4
  - pyyaml>=6,<7

  - pip:
      # CUDA 12.8 wheels are required for RTX 50-series / sm_120. The explicit
      # +cu128 suffix prevents Pip from silently selecting a CPU/cu126 build.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128

      # Versions shared with the environment used to train/load SmolVLA2.
      - transformers==4.53.3
      - accelerate==1.7.0
      - datasets==3.6.0
      - fsspec[http]==2025.3.0
      - peft==0.15.2
      - safetensors==0.5.3
      - draccus==0.10.0
      - huggingface-hub==0.34.3
      - einops==0.8.1
      - packaging>=24.2,<26
      - jsonlines==4.0.0
      - imageio>=2.34,<3
      - av>=14.4,<16
      - pillow>=11,<13
